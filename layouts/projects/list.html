{{ define "main" }}
<div class="portfolio">

<section class="page-hero">
  <span class="section-label">{{ .Title }}</span>
  <h1>{{ .Title }}</h1>
  <div>{{ .Content }}</div>
</section>

<section>
  <div class="project-grid">
    {{ range .Pages }}
    {{ $p := . }}
    <a class="project-card" href="{{ $p.RelPermalink }}">
      <h3>{{ $p.Title }}</h3>
      <p>{{ $p.Params.summary | default $p.Summary }}</p>
    </a>
    {{ end }}
  </div>
</section>

</div>
{{ end }}
