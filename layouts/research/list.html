{{ define "main" }}
<div class="portfolio">

<section class="page-hero">
  <span class="section-label">{{ .Title }}</span>
  <h1>{{ .Title }}</h1>
  <div>{{ .Content }}</div>
</section>

<section>
  <div class="project-grid">
    {{ range .Pages }}
      {{ partial "project-card.html" . }}
    {{ end }}
  </div>
</section>

</div>
{{ end }}
