{{ define "main" }}
<article class="portfolio research-detail">
  <span class="section-label">Research</span>
  <h1>{{ .Title }}</h1>
  <div class="detail-meta">
    {{ with .Params.year }}<span class="meta-pill">{{ . }}</span>{{ end }}
    {{ with .Params.role }}<span class="meta-pill">{{ . }}</span>{{ end }}
    {{ with .Params.outcome }}<span class="meta-pill meta-pill-accent">{{ . }}</span>{{ end }}
  </div>
  {{ with .Resources.GetMatch (.Params.cover.image | default "") }}
  <img class="detail-cover" src="{{ .RelPermalink }}" alt="">
{{ end }}
  <div class="detail-content">{{ .Content }}</div>
</article>
{{ end }}
