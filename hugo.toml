baseURL = "https://sanjayramkumar27.github.io/"
title = "Sanjay Ramkumar"
theme = "PaperMod"

[params]
description = "Aerospace & Robotics Engineering Portfolio"
ShowReadingTime = true
ShowShareButtons = false
math = true

# Look and feel (see the notes at the top of portfolio.css)
# palette:  "lime" | "blue" | "green" | "teal"
# fontPair: "archivo" | "inter" | "manrope" | "grotesk" | "plex" | "editorial"
palette = "teal"
fontPair = "inter"

[markup.goldmark.renderer]
  unsafe = true
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]

[menu]
  [[menu.main]]
    identifier = "research"
    name = "Research"
    url = "/research/"
    weight = 10
  [[menu.main]]
    identifier = "competitions"
    name = "Competitions"
    url = "/competitions/"
    weight = 20
  [[menu.main]]
    identifier = "projects"
    name = "Personal Projects"
    url = "/projects/"
    weight = 30